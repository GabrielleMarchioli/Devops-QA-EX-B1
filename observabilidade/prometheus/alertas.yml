# Cada alerta valida um requisito arquitetural dos desafios 3, 4 e 6
groups:
  - name: evidencias-arquiteturais
    rules:
      - alert: IaServiceDegradado
        # ADR-003: IA pode falhar sem bloquear o Core; o alerta mede a degradacao, nao derruba nada
        expr: sum(rate(ia_requisicoes_total{status=~"5.."}[1m])) / clamp_min(sum(rate(ia_requisicoes_total[1m])), 0.001) > 0.2
        for: 30s
        labels: { severidade: aviso }
        annotations:
          resumo: "Mais de 20% das chamadas ao ia-service falhando; Core usando fallback"

      - alert: CoreUsandoFallbackDeIa
        expr: sum(rate(ia_requisicoes_seconds_count{resultado="falha"}[1m])) > 0
        for: 30s
        labels: { severidade: aviso }

      - alert: OutboxAcumulando
        # ADR-004: consumidor/broker fora; eventos retidos, conclusao do curso segue funcionando
        expr: outbox_eventos_pendentes > 20
        for: 1m
        labels: { severidade: aviso }

      - alert: LatenciaConclusaoCursoAlta
        # ADR-001/004: fluxo sincrono essencial precisa continuar rapido
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri="/api/alunos/{alunoId}/conclusoes"}[5m]))) > 0.5
        for: 2m
        labels: { severidade: critica }
