global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: core-gamificacao
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: ia-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["ia-service:8000"]

  - job_name: iot-gateway
    static_configs:
      - targets: ["host.docker.internal:9102"]