spring.application.name=educacao-continuada-gamificada

spring.datasource.url=jdbc:h2:mem:educacao
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# ---------- B1: Arquitetura evolutiva ----------
# Desafio 3: servico Python de IA (FastAPI)
ia.service.url=${IA_SERVICE_URL:http://localhost:8000}
ia.service.timeout-ms=${IA_SERVICE_TIMEOUT_MS:1500}

# Desafio 4: relay do outbox
outbox.relay.intervalo-ms=5000
outbox.relay.max-tentativas=10

# Desafio 6: observabilidade
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=core-gamificacao
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.ia.requisicoes=true
# sem broker no perfil padrao: health do RabbitMQ so conta no perfil "rabbit"
management.health.rabbit.enabled=false
